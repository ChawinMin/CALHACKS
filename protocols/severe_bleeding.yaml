id: severe_bleeding
title: Severe bleeding
priority: 2
escalate_to_emergency_services: true
dispatcher_summary: "Person with severe external bleeding; direct pressure being applied."
clarifying_question: "Is the blood soaking through clothing, spurting, or not stopping?"
trigger_signs:
  heavy_bleeding: 0.8
  spurting_blood: 0.9
  blood_soaking_through: 0.8
  visible_wound: 0.3
  amputation: 0.9
steps:
  - id: call_911
    text: Call emergency services.
    spoken: "Call 911 now."
    observable_action: null
    needs_confirmation: true
  - id: pressure
    text: Press firmly directly on the wound with a clean cloth or bandage. Use both hands and lean your weight.
    spoken: "Press hard directly on the wound with a clean cloth. Use both hands and keep pressing."
    observable_action: hands_on_wound
    needs_confirmation: true
  - id: no_peek
    text: Do not lift the cloth to check. If blood soaks through, add more cloth on top and keep pressing.
    spoken: "Don't lift the cloth. If it soaks through, add more on top and keep pressing."
    observable_action: null
    needs_confirmation: false
  - id: tourniquet
    text: If a limb wound is life-threatening and pressure fails, and you are trained, apply a tourniquet 2-3 inches above the wound.
    spoken: "If bleeding on an arm or leg won't stop and you know how, apply a tourniquet above the wound."
    observable_action: null
    needs_confirmation: true
  - id: lay_down
    text: Lay the person down and keep them warm. Keep pressing until help arrives.
    spoken: "Keep them lying down and warm. Keep pressing until help arrives."
    observable_action: null
    needs_confirmation: false
reviewed_by: PENDING_MEDICAL_REVIEW
source: "Stop the Bleed / Red Cross guidance (to be verified by reviewer)"
